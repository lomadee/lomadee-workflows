name: Coolify Build Deploy Dashboard
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      coolify_uuid:
        required: true
        type: string
      github_environment:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile

concurrency:
  group: coolify-deploy-${{ inputs.app_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build and deploy ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DO Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DOCR_USERNAME }}
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            NPM_TOKEN=${{ secrets.GH_TOKEN }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_MAIN_API_URL=${{ secrets.NEXT_PUBLIC_MAIN_API_URL }}
            NEXT_PUBLIC_FINANCE_API_OLD_URL=${{ secrets.NEXT_PUBLIC_FINANCE_API_OLD_URL }}
            NEXT_PUBLIC_FINANCE_API_URL=${{ secrets.NEXT_PUBLIC_FINANCE_API_URL }}
            NEXT_PUBLIC_PAYMENTS_API_URL=${{ secrets.NEXT_PUBLIC_PAYMENTS_API_URL }}
            NEXT_PUBLIC_CHANNELS_API_URL=${{ secrets.NEXT_PUBLIC_CHANNELS_API_URL }}
            NEXT_PUBLIC_ORDERS_API_URL=${{ secrets.NEXT_PUBLIC_ORDERS_API_URL }}
            NEXT_PUBLIC_CAMPAIGNS_API_URL=${{ secrets.NEXT_PUBLIC_CAMPAIGNS_API_URL }}
            NEXT_PUBLIC_LINK_GENERATOR_API_URL=${{ secrets.NEXT_PUBLIC_LINK_GENERATOR_API_URL }}
            NEXT_PUBLIC_REPORTS_API_URL=${{ secrets.NEXT_PUBLIC_REPORTS_API_URL }}
            NEXT_PUBLIC_MAIN_URL=${{ secrets.NEXT_PUBLIC_MAIN_URL }}
            NEXT_PUBLIC_ENVIRONMENT=${{ secrets.NEXT_PUBLIC_ENVIRONMENT }}
            NEXT_PUBLIC_AUTH_URL=${{ secrets.NEXT_PUBLIC_AUTH_URL }}
            NEXT_PUBLIC_DASHBOARD_API_URL=${{ secrets.NEXT_PUBLIC_DASHBOARD_API_URL }}
            NEXT_PUBLIC_COMMISSIONS_API_URL=${{ secrets.NEXT_PUBLIC_COMMISSIONS_API_URL }}
            NEXT_PUBLIC_INSTAGRAM_CLIENT_ID=${{ secrets.NEXT_PUBLIC_INSTAGRAM_CLIENT_ID }}
            NEXT_PUBLIC_INSTAGRAM_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_INSTAGRAM_REDIRECT_URI }}
            NEXT_PUBLIC_FACEBOOK_CLIENT_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_CLIENT_ID }}
            NEXT_PUBLIC_FACEBOOK_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_FACEBOOK_REDIRECT_URI }}
            NEXT_PUBLIC_YOUTUBE_REDIRECT_URI=${{ secrets.NEXT_PUBLIC_YOUTUBE_REDIRECT_URI }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_YOUTUBE_API_KEY=${{ secrets.NEXT_PUBLIC_YOUTUBE_API_KEY }}
            NEXT_PUBLIC_AUTH_ENVIRONMENT=${{ secrets.NEXT_PUBLIC_AUTH_ENVIRONMENT }}
            NEXT_PUBLIC_GRAPHQL_WS_URL=${{ secrets.NEXT_PUBLIC_GRAPHQL_WS_URL }}
            NEXT_PUBLIC_LOMADEE_INTERNAL_URL=${{ secrets.NEXT_PUBLIC_LOMADEE_INTERNAL_URL }}
            NEXT_PUBLIC_INSIGHTS_API_URL=${{ secrets.NEXT_PUBLIC_INSIGHTS_API_URL }}
            NEXT_PUBLIC_PROVIDERS_API_URL=${{ secrets.NEXT_PUBLIC_PROVIDERS_API_URL }}
            NEXT_PUBLIC_OPEN_API_URL=${{ secrets.NEXT_PUBLIC_OPEN_API_URL }}
            NEXT_PUBLIC_AFFILIATE_STORE_API_URL=${{ secrets.NEXT_PUBLIC_AFFILIATE_STORE_API_URL }}
            NEXT_PUBLIC_ASSETS_BASE_URL=${{ secrets.NEXT_PUBLIC_ASSETS_BASE_URL }}
            NEXT_PUBLIC_WILDCARD_DOMAIN=${{ secrets.NEXT_PUBLIC_WILDCARD_DOMAIN }}
            NEXT_PUBLIC_APP_VERSION=${{ secrets.NEXT_PUBLIC_APP_VERSION }}
            NEXT_PUBLIC_GLEAP_API_KEY=${{ secrets.NEXT_PUBLIC_GLEAP_API_KEY }}
            NEXT_PUBLIC_STATSIG_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_STATSIG_CLIENT_KEY }}
            NEXT_PUBLIC_SHOW_ERROR_DETAILS=${{ secrets.NEXT_PUBLIC_SHOW_ERROR_DETAILS }}
            NEXT_PUBLIC_NEW_RELIC_LICENSE_KEY=${{ secrets.NEXT_PUBLIC_NEW_RELIC_LICENSE_KEY }}
            NEXT_PUBLIC_NEW_RELIC_APPLICATION_ID=${{ secrets.NEXT_PUBLIC_NEW_RELIC_APPLICATION_ID }}
            NEXT_PUBLIC_NEW_RELIC_ACCOUNT_ID=${{ secrets.NEXT_PUBLIC_NEW_RELIC_ACCOUNT_ID }}
            NEXT_PUBLIC_NEW_RELIC_AGENT_ID=${{ secrets.NEXT_PUBLIC_NEW_RELIC_AGENT_ID }}
            NEXT_PUBLIC_NEW_RELIC_TRUST_KEY=${{ secrets.NEXT_PUBLIC_NEW_RELIC_TRUST_KEY }}
            NEXT_PUBLIC_NEW_RELIC_BEACON=${{ secrets.NEXT_PUBLIC_NEW_RELIC_BEACON }}
            NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }}
            NEXT_PUBLIC_MIXPANEL_TOKEN=${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          secrets: npm_token=${{ secrets.GH_TOKEN }}
          tags: |
            registry.digitalocean.com/lomadee/${{ inputs.app_name }}:latest
            registry.digitalocean.com/lomadee/${{ inputs.app_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deploy
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 25 \
                --request POST \
                "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ inputs.coolify_uuid }}&force=true" \
                -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"; then
              echo "deploy enfileirado (tentativa $attempt)"; exit 0
            fi
            echo "tentativa $attempt falhou; retry em 10s"; sleep 10
          done
          echo "::error::falha ao disparar deploy no Coolify após 6 tentativas"; exit 1
